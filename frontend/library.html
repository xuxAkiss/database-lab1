<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题目与题库</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/surveys.css"><script defer src="/static/library.js"></script></head><body><main><header><h1>题目与题库</h1><a href="/manage">我的问卷</a><a href="/">账号</a></header><p id="message" role="status">正在加载…</p><div id="workspace" hidden><section><h2>我的题库</h2><form id="bank-create"><label>题库名称<input name="name" required maxlength="100"></label><button>创建题库</button></form><div id="banks"></div></section><section><h2>可用题目</h2><button id="refresh">刷新</button><button id="new">新建独立题目</button><div id="list"></div></section><section id="editor"><h2 id="heading">新建独立题目</h2><p>保存后产生不可变版本；选中任一历史版本可编辑分支或恢复。问卷引用不会自动更新。</p><label>题型<select id="type"><option value="single">单选</option><option value="multiple">多选</option><option value="text">文本</option><option value="number">数字</option></select></label><label>题目<input id="title" maxlength="300"></label><label><input type="checkbox" id="required">必答</label><label>选项（每行一个，保持顺序修改文字可保留选项身份）<textarea id="options"></textarea></label><div id="limits"></div><button id="save">保存新题</button><button id="derive" hidden>派生为我拥有的新题</button><section id="history" hidden><h3>版本历史</h3><select id="versions"></select><button id="load">载入历史版本内容</button><button id="restore">恢复选中版本为新版</button><p id="lineage"></p><h3>共享</h3><label>已注册用户名<input id="username"></label><button id="grant">授予读取与使用</button><button id="revoke">撤销共享</button><p id="shares"></p><h3>使用情况</h3><button id="usage">查询选中版本的使用</button><pre id="usage-result"></pre></section></section></div></main></body></html>
